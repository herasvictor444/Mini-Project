<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- UTF-8 allows us to copy/paste emojis directly into our code -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mini Project</title>
    <!-- This is the first real FES project I'm making and uploading to Github -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <!-- I'm practicing writing comments as that seems like good practice and will aid with remember what I was doing when it comes to debugging and such. -->
  <body>
    <!-- We need a header, middle, and footer -->
    <section>
      <!-- Nav bar -->
      <nav>
        <div class="logo">
          <img
            src="./assets/fes-logo.png"
            alt="Frontend Simplified Logo"
            class="logo__img"
            width="50"
          />
          <h1 class="logo__text"><b>Frontend</b> Simplified</h1>
        </div>
        <ul>
          <li><a href="#about">About</a></li>
          <li><a href="#social">Social</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>

      <!-- Header -->
      <header>
        <div class="row row__course">
          <div class="course">
            <h1 class="course__icon">💾</h1>
            <div class="course__text">
              <div class="course__selection">----YOUR COURSE----</div>
              <div class="course__title">Software Engineering</div>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="hero">
            <figure class="hero__img--wrapper">
              <img src="./assets/laptop.png" alt="" />
            </figure>
            <div class="hero__description">
              <h1>Best place to learn frontend</h1>
              <p class="subheader">
                Go from absolute beginner to pro with a simplified process
              </p>
              <a href="#about">
                <button class="hero__description--button">▷ LEARN MORE</button>
              </a>
            </div>
          </div>
        </div>
      </header>
    </section>
  </body>
  <foot>
    <!-- We have a head and we have a body. Adding a foot only made sense despite it not being added by default. -->
  </foot>
</html>
<!-- Shift + alt + f to enable "prettier" function. This works as long as you have the prettier plug-in installed in VS Code -->
